<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{.gas.Title}} - Детальная информация</title>
    <link rel="stylesheet" href="/styles/index_style.css">
</head>
<body>
<header>
    <a href="/gases" class="home-btn">🏠 Домой</a>
</header>

<main>
    <div class="page-header">
        <h1>{{.gas.Title}}</h1>
    </div>

    <div class="gas-detail-container">
        <div class="gas-detail-card">
            <div class="gas-image">
                <img src="{{.gas.ImageURL}}" alt="{{.gas.Title}}" width="300">
            </div>
            
            <div class="gas-info">
                <h2>{{.gas.Title}}</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <strong>Химическая формула:</strong>
                        <span class="formula">{{.gas.Formula}}</span>
                    </div>
                    <div class="info-item">
                        <strong>Молярная масса:</strong>
                        <span class="molar-mass">{{.gas.MolarMass}} г/моль</span>
                    </div>
                </div>
                
                <div class="description">
                    <h3>Описание</h3>
                    <p>{{.gas.Description}}</p>
                </div>
                
            </div>
        </div>
    </div>
</main>

<style>
    .gas-detail-container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
    }

    .gas-detail-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 30px;
        align-items: start;
    }

    .gas-image {
        text-align: center;
    }

    .gas-image img {
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        max-width: 100%;
        height: auto;
    }

    .gas-info h2 {
        color: #2d3748;
        font-size: 2em;
        margin-bottom: 20px;
        text-align: center;
    }

    .info-grid {
        display: grid;
        gap: 15px;
        margin-bottom: 25px;
    }

    .info-item {
        background: rgba(102, 126, 234, 0.1);
        padding: 15px;
        border-radius: 12px;
        border-left: 4px solid #667eea;
    }

    .info-item strong {
        color: #2d3748;
        font-weight: 600;
        display: block;
        margin-bottom: 5px;
    }

    .formula {
        font-family: 'Courier New', monospace;
        font-size: 1.2em;
        color: #667eea;
        font-weight: bold;
    }

    .molar-mass {
        font-size: 1.1em;
        color: #4a5568;
        font-weight: 500;
    }

    .description {
        margin-top: 20px;
    }

    .description h3 {
        color: #2d3748;
        margin-bottom: 10px;
        font-size: 1.3em;
    }

    .description p {
        color: #4a5568;
        line-height: 1.6;
        font-size: 1.1em;
    }

    .action-buttons {
        display: flex;
        gap: 15px;
        margin-top: 30px;
        justify-content: center;
    }

    .add-to-journal-btn {
        padding: 12px 24px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: none;
        cursor: pointer;
        font-size: 15px;
    }

    .add-to-journal-btn {
        background: #667eea;
        color: white;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .add-to-journal-btn:hover {
        background: #764ba2;
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(102, 126, 234, 0.4);
    }

    /* Адаптивность */
    @media (max-width: 768px) {
        .gas-detail-card {
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 20px;
        }

        .action-buttons {
            flex-direction: column;
        }

        .gas-image img {
            max-width: 250px;
        }
    }
</style>
</body>
</html>
