<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список газов</title>
    <link rel="stylesheet" href="/static/styles/index_style.css">
</head>
<body>
<header>
    <a href="/gases" class="home-btn">🏠 Домой</a>
</header>

<main>
    <div class="page-header">
        <h1>Типы газов</h1>
        <a href="/cart" class="cart-link">
            <span class="cart-icon">🧪</span>
            Журнал расчетов
            <span class="cart-count">5</span>
        </a>
    </div>

    <form method="get" action="/gases" class="search-form">
        <input type="text" name="query" placeholder="Поиск газа..." value="{{.query}}">
        <button type="submit">🔍 Поиск газа</button>
    </form>

    <div class="grid">
        {{range .gases}}
        <div class="card">
            <h2>{{.Title}}</h2>
            <img src="{{.ImageURL}}" alt="{{.Title}}" width="150">
            <p>Формула: {{.Formula}}</p>
            <p>Молярная масса: {{.MolarMass}} г/моль</p>
            <p>{{.Description}}</p>
            <a href="/gases/{{.ID}}" class="yellow-btn">Подробнее</a>
        </div>
        {{end}}
    </div>
</main>
</body>
</html>
