<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Журнал расчетов</title>
    <link rel="stylesheet" href="/static/styles/journal_style.css">
</head>
<body>
<header>
    <a href="/gas" class="home-btn">🏠 Домой</a>
</header>

<main>
    <div class="journal-container">
        <div class="journal-header">
            <h1>🧪 Журнал расчетов</h1>
            <p>Всего расчетов: {{len .gases}}</p>
        </div>

        {{if .gases}}
        <div class="calculations-table-container">
            <table class="calculations-table">
                <thead>
                <tr>
                    <th>Газ</th>
                    <th>Формула</th>
                    <th>Молярная масса</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                {{range .gases}}
                <tr>
                    <td class="gas-info-cell">
                        <div class="gas-main-info">
                            <div class="gas-name">{{.gas_title}}</div>
                            {{if .gas_image_url}}
                            <img src="{{.gas_image_url}}" alt="{{.gas_title}}" class="gas-image">
                            {{end}}
                        </div>
                    </td>
                    <td class="gas-formula-cell">
                        <span class="gas-formula">{{.gas_formula}}</span>
                    </td>
                    <td class="gas-mass">
                        {{printf "%.2f" .gas_molar_mass}} г/моль
                    </td>
                    <td class="actions-cell">
                        <!-- Форма для логического удаления -->
                        <form method="post" action="/calculation/{{.gas_calculation_id}}/remove" style="display: inline;">
                            <button type="submit" class="remove-gas-btn" title="Удалить из расчета">
                                ❌ Удалить
                            </button>
                        </form>
                    </td>
                </tr>
                {{end}}
                </tbody>
            </table>
        </div>
        {{else}}
        <div class="empty-journal">
            <div class="empty-icon">📝</div>
            <h3>Журнал расчетов пуст</h3>
        {{end}}
    </div>
</main>
</body>
</html>
